name: Generate uv lockfile (migration bootstrap)

on:
  push:
    branches:
      - "migrate/uv-lock"
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Generate lockfile
        run: uv lock --python 3.12

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already up to date"
            exit 0
          fi
          git commit -m "chore: generate uv lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
