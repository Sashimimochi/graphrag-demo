name: Docker Build Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "docker-compose.yml"
      - ".github/workflows/docker-build-check.yml"
      - ".github/workflows/sync-uv-lockfile.yml"
  workflow_dispatch:

jobs:
  lockfile-check:
    name: Check uv lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Check lockfile consistency
        run: uv lock --check --python 3.12

  build:
    needs: lockfile-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: graphrag-demo:test
